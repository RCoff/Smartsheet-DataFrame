name: Publish Python Package

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.8', '3.9', '3.10', '3.11', '3.12' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools wheel build

      - name: Build the package
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          # no name -> download all artifacts
          path: dist_all

      - name: Inspect downloaded artifacts
        run: ls -R dist_all

      - name: Set up Python for publishing
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install twine
        run: python -m pip install --upgrade pip && pip install twine

      - name: Consolidate artifacts and publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          mkdir -p dist
          # copy all built files from each artifact folder into a single dist/
          find dist_all -type f -maxdepth 3 -exec cp {} dist/ \;
          ls -al dist
          python -m twine upload dist/* --skip-existing
